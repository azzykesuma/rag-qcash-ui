name: Security & Privacy Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Audit Datasets for Secrets & Sensitive Paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Vault Tool
        run: go build -o vault ./cmd/vault

      - name: Run Go Tests
        run: go test ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Privacy & Secret Audit
        run: ./vault audit
