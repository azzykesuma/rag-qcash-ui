name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          # Windows (x86_64)
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/vault-windows-amd64.exe ./cmd/vault
          # Linux (x86_64)
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/vault-linux-amd64 ./cmd/vault
          # macOS (Apple Silicon M1/M2/M3/M4)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/vault-darwin-arm64 ./cmd/vault
          # macOS (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/vault-darwin-amd64 ./cmd/vault

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
