name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download Go Dependencies
        run: go mod download

      - name: Build Windows Binary
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: 'amd64'
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w" -o dist/vault-windows-amd64.exe ./cmd/vault

      - name: Build Linux Binary
        env:
          CGO_ENABLED: '0'
          GOOS: 'linux'
          GOARCH: 'amd64'
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w" -o dist/vault-linux-amd64 ./cmd/vault

      - name: Build macOS ARM Binary
        env:
          CGO_ENABLED: '0'
          GOOS: 'darwin'
          GOARCH: 'arm64'
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w" -o dist/vault-darwin-arm64 ./cmd/vault

      - name: Build macOS Intel Binary
        env:
          CGO_ENABLED: '0'
          GOOS: 'darwin'
          GOARCH: 'amd64'
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w" -o dist/vault-darwin-amd64 ./cmd/vault

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
