<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Context Vault</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#10151f;color:#e6edf3}body{margin:0}header{padding:24px 32px;background:#182130;border-bottom:1px solid #334155}h1{margin:0 0 8px;font-size:24px}p{color:#aab9cb}main{padding:24px 32px;max-width:1500px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,button{font:inherit;border:1px solid #42536d;border-radius:7px;padding:10px;background:#1e293b;color:inherit}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{background:#334765}button:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr);gap:22px}#sessions{max-height:70vh;overflow:auto}.session{display:block;text-align:left;width:100%;margin-bottom:8px}.session small{display:block;color:#aab9cb;margin-top:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#182130;padding:20px;border-radius:8px;max-height:65vh;overflow:auto;font:13px/1.6 ui-monospace,monospace}h2{font-size:18px}#status{min-height:22px;color:#93c5fd}#metrics{color:#9bc4fc}#detail-title{overflow-wrap:anywhere}@media(max-width:750px){.layout{grid-template-columns:1fr}main,header{padding:18px}#sessions{max-height:35vh}}
</style>
</head>
<body>
<header><h1>LLM Context Vault</h1><div>Browse your sanitized assistant conversations, search, and build prompt context.</div></header>
<main>
<div id="metrics">Loading vault…</div>
<form id="search-form"><div class="toolbar"><input id="query" aria-label="Search conversations" placeholder="Search by topic, error, or question…"><select id="tool" aria-label="Filter by assistant"><option value="">All assistants</option></select><input id="project" aria-label="Project alias" placeholder="Project alias (optional)"><button>Search</button><button type="button" id="reset">Reset</button></div><div class="toolbar"><label>From <input id="after" type="date" aria-label="Earliest date"></label><label>To <input id="before" type="date" aria-label="Latest date"></label><label>Results <input id="limit" type="number" min="1" max="100" value="10" aria-label="Result limit"></label><label>Context characters <input id="max-chars" type="number" min="512" max="1000000" value="12000" aria-label="Context character budget"></label></div></form>
<div class="toolbar"><button id="context">Generate context</button><button id="audit">Run privacy audit</button><button id="refresh">Refresh</button><button id="copy">Copy displayed text</button></div>
<div id="status" role="status" aria-live="polite"></div>
<div class="layout"><section><h2 id="list-title">Conversations</h2><div id="sessions"></div></section><section><h2 id="detail-title">Conversation viewer</h2><pre id="detail">Select a conversation to view its exported Markdown.</pre></section></div>
</main>
<script>
const $=id=>document.getElementById(id);
let sessions=[],matches=null;
async function request(path,json=true){const response=await fetch(path);if(!response.ok)throw new Error(await response.text());return json?response.json():response.text()}
async function action(fn){$('status').textContent='Working…';try{await fn();$('status').textContent='Ready.'}catch(error){$('status').textContent=error.message}}
function show(title,text){$('detail-title').textContent=title;$('detail').textContent=text}
function render(){const project=$('project').value.trim().toLowerCase(),after=$('after').value,before=$('before').value;const visible=sessions.filter(s=>(!$('tool').value||s.tool===$('tool').value)&&(!project||s.project.toLowerCase()===project)&&(!after||s.date.slice(0,10)>=after)&&(!before||s.date.slice(0,10)<=before)&&(!matches||matches.has(s.file)));if(matches)visible.sort((a,b)=>matches.get(b.file).Score-matches.get(a.file).Score);$('list-title').textContent=(matches?'Ranked matches':'Conversations')+' ('+visible.length+')';$('sessions').replaceChildren();for(const s of visible){const button=document.createElement('button');button.className='session';button.textContent=s.title;const meta=document.createElement('small');const match=matches?.get(s.file);meta.textContent=s.tool+(s.project?' · '+s.project:'')+' · '+s.date+(match?' · lines '+match.StartLine+'–'+match.EndLine:'');button.append(meta);if(match){const preview=document.createElement('small');preview.textContent=match.Snippet.slice(0,220);button.append(preview)}button.onclick=()=>action(async()=>show(s.title,await request('/api/conversation?file='+encodeURIComponent(s.file),false)));$('sessions').append(button)}if(!visible.length)$('sessions').textContent='No matching conversations.'}
async function load(){sessions=await request('/api/sessions');sessions.sort((a,b)=>b.date.localeCompare(a.date));const counts={};for(const s of sessions)counts[s.tool]=(counts[s.tool]||0)+1;$('metrics').textContent=sessions.length+' sessions · '+Object.entries(counts).map(([tool,n])=>tool+': '+n).join(' · ');const selected=$('tool').value;$('tool').replaceChildren(new Option('All assistants',''));for(const tool of Object.keys(counts).sort())$('tool').add(new Option(tool,tool));$('tool').value=selected;matches=null;render()}
function queryParams(){const params=new URLSearchParams({q:$('query').value.trim()});for(const name of ['tool','project','after','before','limit','max-chars'])if($(name).value)params.set(name,$(name).value);return params}
async function search(){const q=$('query').value.trim();if(!q){matches=null}else{const results=await request('/api/search?'+queryParams());matches=new Map((results||[]).map(r=>[r.Path.split(/[\\/]/).pop(),r]))}render()}
$('search-form').onsubmit=event=>{event.preventDefault();action(search)};
$('tool').onchange=()=>action(search);for(const name of ['project','after','before'])$(name).onchange=()=>action(search);
$('reset').onclick=()=>{for(const name of ['query','tool','project','after','before'])$(name).value='';matches=null;render()};
$('refresh').onclick=()=>action(load);
$('context').onclick=()=>action(async()=>{const q=$('query').value.trim();if(!q)throw new Error('Enter a search query first.');show('Prompt context',await request('/api/context?'+queryParams()))});
$('audit').onclick=()=>action(async()=>{const results=await request('/api/audit');const entries=Object.entries(results||{});show('Privacy audit',entries.length?entries.map(([file,warnings])=>file+'\n'+warnings.join('\n')).join('\n\n'):'Privacy audit passed: no potential leaks detected.')});
$('copy').onclick=()=>action(async()=>{await navigator.clipboard.writeText($('detail').textContent)});
action(load);
</script>
</body>
</html>
